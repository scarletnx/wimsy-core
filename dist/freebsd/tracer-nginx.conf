# Tracer's site, as nginx serves it in the web jail: the folder the bot draws (tracer_site), mounted read-only at
# /usr/local/www/tracer, reached by the jail's own cloudflared on 127.0.0.1:8080, and /mcp sent to tracer-mcp (the
# service tracer_mcp) on 127.0.0.1:8081. Goes in nginx.conf's http block.
# Everything a log or a message said is escaped in the pages; these headers keep a log or a screenshot from being
# read as anything else, and the pages from running anything but site.js.
#
# /mcp is open to anyone, and each request reads the reports' JSON or a log: 2 a second for each client, by the address
# Cloudflare names (every request comes from the tunnel, on 127.0.0.1), 8 at once in all (tracer-mcp answers 4).
limit_req_zone $http_cf_connecting_ip zone=tracer_mcp:1m rate=2r/s;
limit_conn_zone $server_name zone=tracer_mcp_all:1m;
server {
	listen 127.0.0.1:8080;
	server_name _;
	root /usr/local/www/tracer;
	index index.html;
	charset utf-8;
	charset_types text/plain text/css text/javascript;
	types {
		text/html html;
		text/css css;
		text/javascript js;
		image/svg+xml svg;
		image/png png;
		image/jpeg jpg;
		image/gif gif;
		image/webp webp;
		text/plain log;
		video/mp4 mp4;
		video/webm webm;
		application/json json;
	}
	default_type application/octet-stream;
	gzip on;
	gzip_types text/plain text/css text/javascript image/svg+xml;
	add_header X-Content-Type-Options nosniff always;
	add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header Referrer-Policy no-referrer always;
	# a page the bot is writing
	location ~ \.new$ {
		return 404;
	}
	# the MCP server: one JSON-RPC message a POST, answered as JSON. It checks the Origin header itself
	location = /mcp {
		limit_req zone=tracer_mcp burst=20 nodelay;
		limit_conn tracer_mcp_all 8;
		limit_req_status 429;
		limit_conn_status 429;
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_buffering off;
		client_max_body_size 1m;
		limit_except POST GET DELETE {
			deny all;
		}
	}
	location / {
		try_files $uri $uri/ =404;
	}
}
