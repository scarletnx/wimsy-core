name: Games' names

# tracer/titles.tsv again from blawar/titledb (scripts/make-titles.py), each month and by hand: a pull request when a
# name or a game changed. The first line names titledb's commit, which changes each time, so only the lines after it
# are compared. The repository's settings must let GitHub Actions open pull requests.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  titles:
    name: The games' names from titledb
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/make-titles.py
      - name: A pull request when the names changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show HEAD:tracer/titles.tsv | tail -n +2 | cmp -s - <(tail -n +2 tracer/titles.tsv); then
            echo "no name changed"
            exit 0
          fi
          branch="titles/$(date -u +%Y-%m)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add tracer/titles.tsv
          git commit -q -m "[tracer] The games' names as titledb has them now" -m "$(head -1 tracer/titles.tsv)"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" --title "[tracer] The games' names as titledb has them now" \
            --body "tracer/titles.tsv again, by scripts/make-titles.py: $(git diff --stat HEAD~1 | tail -1)." ||
            echo "a pull request for $branch is open already"
